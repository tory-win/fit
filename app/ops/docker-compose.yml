services:
  tryon-api:
    build: ./tryon-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRYON_PORT:-8319}:8319"
    environment:
      TRYON_PORT: 8319
      TRYON_PROXY: ${TRYON_PROXY:-http://host.docker.internal:8318}
      TRYON_MODEL: ${TRYON_MODEL:-gpt-image-2}
      TRYON_QUALITY: ${TRYON_QUALITY:-medium}
      TRYON_API_KEY_FILE: /run/secrets/tryon_proxy_config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - tryon_proxy_config
    labels:
      io.chaengi.release.commit: "${CHAENGI_RELEASE_COMMIT:?set a verified 40-character release commit}"

  web:
    image: ipfit-web:${CHAENGI_RELEASE_COMMIT:?set a verified 40-character release commit}
    build:
      context: ..
      dockerfile: ops/web/Dockerfile
      args:
        OJJEOM_PUBLIC_ORIGIN: ${OJJEOM_PUBLIC_ORIGIN:-https://macmini.tailbba978.ts.net:10000/ojjeom}
        CHAENGI_RELEASE_COMMIT: ${CHAENGI_RELEASE_COMMIT:?set a verified 40-character release commit}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IPFIT_WEB_PORT:-15174}:15174"
    depends_on:
      - tryon-api
    labels:
      io.chaengi.release.commit: "${CHAENGI_RELEASE_COMMIT:?set a verified 40-character release commit}"

secrets:
  tryon_proxy_config:
    file: ${TRYON_PROXY_CONFIG_PATH:?set TRYON_PROXY_CONFIG_PATH to a local read-only config file}
