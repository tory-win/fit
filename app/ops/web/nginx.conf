server {
  listen 15174;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $tryon_origin http://tryon-api:8319;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /ojjeom {
    return 308 /ojjeom/;
  }

  location = /ojjeom/__release {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location = /ojjeom/__tryon {
    client_max_body_size 22m;
    proxy_request_buffering off;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass $tryon_origin/__tryon;
  }

  location = /ojjeom/__tryon/health {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass $tryon_origin/__tryon/health;
  }

  # 운영 이미지에는 HMR과 원본 TypeScript 경로가 없어야 한다.
  location ~ ^/ojjeom/(?:@vite|@react-refresh|src/) {
    return 404;
  }

  location /ojjeom/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location /ojjeom/ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /ojjeom/index.html;
  }
}
